<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Huebito</title>
    <meta name="theme-color" content="#F5F5F7" />
    <script>
      // Aplica el tema guardado antes de que cargue React, para que no se vea
      // un destello del tema equivocado al abrir la app. Sin elección guardada
      // la app arranca en claro.
      try {
        if (localStorage.getItem('huebito_tema') === 'oscuro') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
